<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plano de disposición en planta</title>
<!-- PAT 135 (T7.3) y PAT 140 (plano detallado): plano en planta del layout. Un solo archivo, sin internet: HTML, CSS y JavaScript con SVG
     nativo; componente bidireccional de Streamlit (apiVersion 1, por postMessage).
     Recibe {equipos, posiciones, corrientes, pasillo, version, ultimo_seq, y_corte, plano: {capas, simbolos, ext}, css: {plano, color},
     leyenda, cajetin, vista} y devuelve {posiciones, seq, version, vista} cada vez que el usuario suelta o rota un equipo o cambia la
     vista o las capas. Coordenadas en m: x al este, y al norte; rot en grados antihorario. El dibujo detallado (símbolos, edificio,
     cañerías, bandeja y cotas) lo arma Python (pat_sim/motor/plano_detalle.py) con y hacia abajo (y_svg = -y); este archivo solo lo
     ubica, lo mueve con el arrastre y cambia el estilo (vista de plano o a color) y las capas visibles. -->
<style>
:root{--tinta:#173243;--suave:#5b7280;--borde:#cfdde2;--sel:#2563eb;--rojo:#bd4b40}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:"Source Sans Pro","Segoe UI",system-ui,Arial,sans-serif;font-size:14px;color:var(--tinta)}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid #c9dbe1;border-radius:6px;padding:3px 9px;background:#eef5f7;color:#16485a;font-weight:600}
button:hover{background:#dfeef2}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,label.capa:focus-within{outline:2px solid var(--sel);outline-offset:1px}
.barra{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.grupo{display:flex;gap:4px;align-items:center}
.seg{display:inline-flex;border:1px solid #9fb6bf;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:#33515f;font-weight:600;padding:4px 11px}
.seg button+button{border-left:1px solid #9fb6bf}
.seg button[aria-pressed="true"]{background:#173243;color:#fff}
label.capa{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#33515f;border:1px solid #d3e0e5;border-radius:12px;padding:1px 8px 1px 5px;cursor:pointer;user-select:none;background:#fff}
label.capa input{margin:0;accent-color:#173243}
.nota{color:var(--suave);font-size:12.5px;margin:0 0 6px}
.plano{position:relative;height:680px;border:1px solid var(--borde);border-radius:8px;overflow:hidden;background:#fff}
.plano svg{display:block;width:100%;height:100%;touch-action:none;user-select:none}
.eq{cursor:grab}
.eq:active{cursor:grabbing}
.estado{position:absolute;left:8px;top:8px;font-size:12.5px;padding:3px 9px;border-radius:12px;background:#e3f3ec;color:#145e45;border:1px solid #b9dccc;pointer-events:none;max-width:70%}
.estado.mal{background:#fbe9e7;color:#9c3329;border-color:#efc4be}
.marca-sel{fill:none;stroke:var(--sel)}
.marca-mal{fill:#bd4b4022;stroke:var(--rojo)}
.previa{fill:none;stroke:#2563eb;stroke-dasharray:6 4}
/* PAT 140 i: las marcas rojas de superposición, el recorrido provisorio, la línea de corte y las capas dibujadas sobre los equipos
   (cañerías, bandeja, textos y cotas) no capturan el puntero; así un equipo marcado en rojo se puede arrastrar para separarlo */
#mundo > g:not(#g-eq), #sobre, #grilla{pointer-events:none}
</style>
</head>
<body>
<div class="barra">
  <div class="seg" role="group" aria-label="Vista">
    <button id="v-plano" aria-pressed="true" title="Blanco y negro, como un plano de CAD">Vista de plano</button><button id="v-color" aria-pressed="false" title="Colores por servicio y por sala">Vista a color</button>
  </div>
  <div class="grupo" id="capas" role="group" aria-label="Capas visibles"></div>
  <div class="grupo">
    <button id="b-rot" title="Rota 90° el equipo seleccionado (tecla R o doble clic)" disabled>Rotar 90°</button>
    <button id="b-ajustar" title="Ajusta la vista a la nave y sus anexos">Ajustar a la nave</button>
    <button id="b-sitio" title="Muestra el sitio completo: patio, estacionamientos y cerco">Sitio completo</button>
    <button id="z-menos" title="Alejar" aria-label="Alejar">−</button><button id="z-mas" title="Acercar" aria-label="Acercar">+</button>
  </div>
</div>
<p class="nota">Arrastre un equipo o la sala eléctrica para moverlo (se ajusta a 0,5 m); doble clic o R para rotarlo; rueda: zoom; arrastrar el fondo: mover la vista. Al soltar se recalculan la nave, las cañerías y la bandeja.</p>
<div class="plano" id="plano"><svg id="svg" xmlns="http://www.w3.org/2000/svg"><style id="estilo"></style><g id="grilla"></g><g id="mundo"></g><g id="sobre"></g></svg><div id="estado" class="estado"></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const PASO = 0.5;                 // m; ajuste de la posición al soltar
const GRUPOS = {edificio: ["SITIO", "EDIFICIO", "PASILLOS"], equipos: ["EQUIPOS", "TEXTOS"], mantencion: ["MANTENCION"],
  canerias: ["CANERIAS"], electrico: ["ELECTRICO"], cotas: ["COTAS", "EJES"]};
const NOMBRES = {edificio: "Edificio", equipos: "Equipos", mantencion: "Zonas de mantención", canerias: "Cañerías", electrico: "Electricidad", cotas: "Cotas"};
let D = null, POS = {}, seq = 0, version = null, sel = null, drag = null, altoPrevio = 0;
let vista = {k: 8, tx: 40, ty: 40}, vistaManual = false, encuadre = "nave";
let modo = "plano", capasOn = new Set(Object.keys(GRUPOS)), vistaRecibida = false;
const sinConfirmar = new Set();   // equipos movidos cuyo dibujo detallado (cañerías, nave) todavía no vuelve de Python

function aST(type, data) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data || {}), "*"); }
function fmt(v, d) { return new Intl.NumberFormat("es-CL", {minimumFractionDigits: d, maximumFractionDigits: d}).format(v); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
const eqPor = id => D.equipos.find(e => e.id === id);
const simPor = id => ((D.plano || {}).simbolos || []).find(s => s.id === id);

window.addEventListener("message", e => {
  const m = e.data;
  if (m && m.type === "streamlit:render" && m.args && m.args.datos) recibir(m.args.datos);
});

function recibir(datos) {
  const primera = D === null;
  D = JSON.parse(JSON.stringify(datos));
  // Se adoptan las posiciones de Python cuando cambió la versión (propuesta nueva o vuelta a la propuesta) o cuando Python ya
  // aplicó el último movimiento; si no, se mantienen las locales para no deshacer un arrastre que todavía viaja.
  const nuevaVersion = version !== D.version;
  if (primera || nuevaVersion || (D.ultimo_seq || 0) >= seq) {
    POS = {};
    for (const [k, v] of Object.entries(D.posiciones || {})) POS[k] = [Number(v[0]), Number(v[1]), Number(v[2] || 0)];
    if (nuevaVersion) vistaManual = false;
    sinConfirmar.clear();
  }
  for (const e of D.equipos) if (!POS[e.id]) POS[e.id] = [e.largo / 2 + D.pasillo, e.ancho / 2 + D.pasillo, 0];
  for (const k of Object.keys(POS)) if (!eqPor(k)) delete POS[k];
  version = D.version; seq = Math.max(seq, D.ultimo_seq || 0);
  if (!vistaRecibida && D.vista) {
    vistaRecibida = true;
    if (D.vista.modo === "color" || D.vista.modo === "plano") modo = D.vista.modo;
    if (Array.isArray(D.vista.capas)) capasOn = new Set(D.vista.capas.filter(c => GRUPOS[c]));
  }
  if (primera && D.sel && !sel) sel = D.sel;        // PAT 140 i: la selección vuelve de Python si el componente se volvió a montar
  if (sel && !eqPor(sel)) sel = null;
  armarCapas(); ponerModo(false);
  dibujarEstatico();
  if (!vistaManual) ajustar(); else pintar();
  altura();
}

function enviar() {
  seq += 1;
  const p = {};
  // PAT 140: sin redondear; redondear a 0,01 m acercaba a menos del pasillo a equipos que la propuesta deja justo a 1,5 m
  for (const [k, v] of Object.entries(POS)) p[k] = [v[0], v[1], v[2]];
  aST("streamlit:setComponentValue", {value: {posiciones: p, seq, version, sel, vista: {modo, capas: [...capasOn]}}, dataType: "json"});
}

function altura() {
  const h = Math.ceil(document.body.getBoundingClientRect().height) + 6;
  if (Math.abs(h - altoPrevio) > 2) { altoPrevio = h; aST("streamlit:setFrameHeight", {height: h}); }
}

// ------------------------------------------------------------------ vista y capas
function ponerModo(enviarCambio) {
  $("estilo").textContent = ((D && D.css) || {})[modo] || "";
  $("v-plano").setAttribute("aria-pressed", modo === "plano"); $("v-color").setAttribute("aria-pressed", modo === "color");
  $("plano").style.background = modo === "color" ? "#f4f7f5" : "#ffffff";
  if (enviarCambio) { pintar(); enviar(); }
}
function armarCapas() {
  const c = $("capas");
  if (c.childElementCount) { for (const i of c.querySelectorAll("input")) i.checked = capasOn.has(i.value); return; }
  for (const g of Object.keys(GRUPOS)) {
    const l = document.createElement("label"); l.className = "capa";
    l.innerHTML = `<input type="checkbox" value="${g}" ${capasOn.has(g) ? "checked" : ""}>${NOMBRES[g]}`;
    l.querySelector("input").addEventListener("change", ev => {
      if (ev.target.checked) capasOn.add(g); else capasOn.delete(g);
      aplicarCapas(); enviar();
    });
    c.appendChild(l);
  }
}
function capaVisible(capa) { for (const [g, cs] of Object.entries(GRUPOS)) if (cs.includes(capa)) return capasOn.has(g); return true; }
function aplicarCapas() {
  for (const n of $("mundo").querySelectorAll("[data-capa]")) n.style.display = capaVisible(n.dataset.capa) ? "" : "none";
}
$("v-plano").onclick = () => { modo = "plano"; ponerModo(true); };
$("v-color").onclick = () => { modo = "color"; ponerModo(true); };

// ------------------------------------------------------------------ geometría (igual que motor/layout.py)
function huella(id) {
  const e = eqPor(id), p = POS[id], r = ((Math.round(p[2] / 90) % 4) + 4) % 4 * 90;
  const L = (r === 0 || r === 180) ? e.largo : e.ancho, W = (r === 0 || r === 180) ? e.ancho : e.largo;
  return [p[0] - L / 2, p[1] - W / 2, p[0] + L / 2, p[1] + W / 2];
}
function conflictos() {
  const ids = Object.keys(POS), malos = new Set(), pares = [], pas = D.pasillo || 0;
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const A = huella(ids[i]), B = huella(ids[j]);
    const sx = Math.max(B[0] - A[2], A[0] - B[2]), sy = Math.max(B[1] - A[3], A[1] - B[3]);
    if (Math.max(sx, sy) < pas - 1e-6) { malos.add(ids[i]); malos.add(ids[j]); pares.push(ids[i] + " con " + ids[j]); }
  }
  return {malos, pares};
}
function limites() {
  const ex = ((D.plano || {})[encuadre === "sitio" ? "ext" : "ext_nave"]) || null;
  let x1 = ex ? ex[0] : 0, y1 = ex ? ex[1] : 0, x2 = ex ? ex[2] : 10, y2 = ex ? ex[3] : 10;
  for (const id of Object.keys(POS)) { const h = huella(id); x1 = Math.min(x1, h[0]); y1 = Math.min(y1, h[1]); x2 = Math.max(x2, h[2]); y2 = Math.max(y2, h[3]); }
  return [x1 - 1, y1 - 1, x2 + 1, y2 + 1];
}
// pantalla: X = tx + x·k ; Y = ty − y·k  (el norte hacia arriba; el dibujo de Python viene con y_svg = −y)
const SX = x => vista.tx + x * vista.k, SY = y => vista.ty - y * vista.k;
const MX = px => (px - vista.tx) / vista.k, MY = py => -(py - vista.ty) / vista.k;

function ajustar() {
  if (!D) return;
  const b = limites(), r = $("plano").getBoundingClientRect(), h = Math.max(r.height, 200);
  const der = r.width > 900 ? 215 : 0, w = Math.max(r.width - der, 300);       // a la derecha quedan la leyenda y el rótulo
  const k = Math.min((w - 30) / (b[2] - b[0]), (h - 30) / (b[3] - b[1]));
  vista.k = Math.max(0.5, k);
  vista.tx = (w - (b[2] - b[0]) * vista.k) / 2 - b[0] * vista.k;
  vista.ty = (h - (b[3] - b[1]) * vista.k) / 2 + b[3] * vista.k;
  pintar();
}

// ------------------------------------------------------------------ dibujo
// El dibujo estático (capas de Python y símbolos) se arma una vez por envío; al mover la vista solo cambia la transformación.
function dibujarEstatico() {
  const P = D.plano || {capas: {}, simbolos: []}, C = P.capas || {}, o = [];
  const capa = (n, html) => o.push(`<g data-capa="${n}">${html || ""}</g>`);
  capa("SITIO", C.SITIO); capa("EDIFICIO", C.EDIFICIO); capa("PASILLOS", C.PASILLOS); capa("EJES", C.EJES);
  o.push('<g id="corte"></g>');
  o.push('<g data-capa="MANTENCION" id="g-mant"></g>');
  capa("CANERIAS", C.CANERIAS);
  o.push('<g data-capa="EQUIPOS" id="g-eq"></g>');
  capa("ELECTRICO", C.ELECTRICO);
  o.push('<g data-capa="TEXTOS" id="g-txt"></g>');
  capa("COTAS", C.COTAS);
  o.push('<g id="g-previa"></g><g id="g-marcas"></g>');
  $("mundo").innerHTML = o.join("");
  const em = [], mm = [];
  for (const e of D.equipos) {
    const s = simPor(e.id) || {};
    const cuerpo = s.svg || `<polygon class="k-EQUIPOS e-gruesa f-eq" points="${-e.largo / 2},${-e.ancho / 2} ${e.largo / 2},${-e.ancho / 2} ${e.largo / 2},${e.ancho / 2} ${-e.largo / 2},${e.ancho / 2}"/>`;
    em.push(`<g class="eq" data-id="${esc(e.id)}"><title>${esc(e.id)} ${esc(e.nombre)}: ${fmt(e.largo, 1)} × ${fmt(e.ancho, 1)} × ${fmt(e.alto, 1)} m (largo × ancho × alto)</title>`
      + `<rect class="toque" x="${-e.largo / 2}" y="${-e.ancho / 2}" width="${e.largo}" height="${e.ancho}" fill="transparent" stroke="none"/>${cuerpo}</g>`);
    mm.push(`<g class="mt" data-id="${esc(e.id)}">${s.mant || ""}</g>`);
  }
  $("g-eq").innerHTML = em.join(""); $("g-mant").innerHTML = mm.join("");
  aplicarCapas();
}

function pintar() {
  if (!D) return;
  const r = $("plano").getBoundingClientRect(), W = r.width || 800, H = r.height || 640;
  $("svg").style.setProperty("--u", (1 / vista.k).toFixed(5));
  $("mundo").setAttribute("transform", `translate(${vista.tx.toFixed(2)} ${vista.ty.toFixed(2)}) scale(${vista.k.toFixed(5)})`);
  // cuadrícula de 1 m (5 m marcada) solo en la vista a color, como guía para el arrastre
  const g = [];
  if (modo === "color") {
    const paso = vista.k < 5 ? 5 : 1, x0 = Math.floor(MX(0)), x1 = Math.ceil(MX(W)), y0 = Math.floor(MY(H)), y1 = Math.ceil(MY(0));
    for (let x = Math.ceil(x0 / paso) * paso; x <= x1; x += paso) g.push(`<line x1="${SX(x)}" y1="0" x2="${SX(x)}" y2="${H}" stroke="${x % 5 === 0 ? "#dde7e3" : "#edf2ef"}"/>`);
    for (let y = Math.ceil(y0 / paso) * paso; y <= y1; y += paso) g.push(`<line x1="0" y1="${SY(y)}" x2="${W}" y2="${SY(y)}" stroke="${y % 5 === 0 ? "#dde7e3" : "#edf2ef"}"/>`);
  }
  $("grilla").innerHTML = g.join("");
  // equipos, zonas de mantención y etiquetas en su posición actual
  for (const n of $("g-eq").children) {
    const p = POS[n.dataset.id]; if (!p) continue;
    n.setAttribute("transform", `translate(${p[0]} ${-p[1]}) rotate(${-p[2]})`);
  }
  for (const n of $("g-mant").children) {
    const p = POS[n.dataset.id]; if (!p) continue;
    n.setAttribute("transform", `translate(${p[0]} ${-p[1]}) rotate(${-p[2]})`);
  }
  const t = [];
  for (const e of D.equipos) {
    const s = simPor(e.id), p = POS[e.id]; if (!p) continue;
    const et = (s && s.etiqueta) || {s: e.id, dx: 0, dy: -(e.ancho / 2) - 0.6, h: 0.45};
    const movido = drag && drag.t === "eq" && drag.id === e.id;
    const dy = movido ? huella(e.id)[1] - p[1] - 0.12 - et.h : et.dy;
    t.push(`<text class="t k-TEXTOS" x="${p[0] + (movido ? 0 : et.dx)}" y="${-(p[1] + dy)}" font-size="${et.h / 0.72}" stroke-width="${et.h * 0.28}" text-anchor="middle">${esc(et.s)}</text>`);
  }
  $("g-txt").innerHTML = t.join("");
  // línea de corte A-A
  const ex = (D.plano || {}).ext || [0, 0, 10, 10];
  $("corte").innerHTML = D.y_corte == null ? "" :
    `<line x1="${ex[0]}" y1="${-D.y_corte}" x2="${ex[2]}" y2="${-D.y_corte}" stroke="#bd4b40" stroke-width="${1.5 / vista.k}" stroke-dasharray="${14 / vista.k} ${4 / vista.k} ${2 / vista.k} ${4 / vista.k}"/>`
    + `<text x="${ex[0] + 0.4}" y="${-D.y_corte - 0.4}" font-size="${13 / vista.k}" font-weight="700" fill="#bd4b40">A</text><text x="${ex[2] - 0.4}" y="${-D.y_corte - 0.4}" text-anchor="end" font-size="${13 / vista.k}" font-weight="700" fill="#bd4b40">A</text>`;
  // durante el arrastre se ocultan las cañerías del equipo movido y se muestra un recorrido provisorio
  for (const n of $("mundo").querySelectorAll("[data-eq]")) {
    const ids = n.dataset.eq.split(" ");
    n.style.visibility = ids.some(i => sinConfirmar.has(i)) ? "hidden" : "";
  }
  const pv = [];
  for (const c of D.corrientes || []) {
    if (!(sinConfirmar.has(c.origen) || sinConfirmar.has(c.destino))) continue;
    const a = POS[c.origen], b = POS[c.destino]; if (!a || !b) continue;
    pv.push(`<path class="previa" d="M${a[0]} ${-a[1]} H${b[0]} V${-b[1]}" stroke-width="${1.6 / vista.k}" stroke-dasharray="${6 / vista.k} ${4 / vista.k}"/>`);
  }
  $("g-previa").innerHTML = pv.join("");
  // marcas de selección y de conflicto
  const {malos, pares} = conflictos(), mk = [];
  for (const id of Object.keys(POS)) {
    if (!(malos.has(id) || id === sel)) continue;
    const h = huella(id);
    mk.push(`<rect class="${malos.has(id) ? "marca-mal" : "marca-sel"}" x="${h[0] - 0.15}" y="${-h[3] - 0.15}" width="${h[2] - h[0] + 0.3}" height="${h[3] - h[1] + 0.3}" stroke-width="${2.2 / vista.k}"/>`);
  }
  $("g-marcas").innerHTML = mk.join("");
  pintarSobre(W, H);
  const est = $("estado");
  est.className = "estado" + (pares.length ? " mal" : "");
  est.textContent = pares.length ? `Superposición o pasillo menor que ${fmt(D.pasillo, 1)} m: ${pares.slice(0, 4).join("; ")}${pares.length > 4 ? "…" : ""}`
    : `Sin superposiciones; pasillo mínimo ${fmt(D.pasillo, 1)} m` + (sel ? `; seleccionado ${sel}` : "");
  $("b-rot").disabled = !sel;
}

// rótulo, norte, escala gráfica y leyenda en coordenadas de pantalla
function pintarSobre(W, H) {
  const o = [], color = modo === "color", tinta = "#1b2b33";
  // escala gráfica: 5, 10, 20 o 50 m según el zoom
  let L = 10; for (const c of [5, 10, 20, 50]) { L = c; if (c * vista.k >= 70) break; }
  const bx = 14, by = H - 26, n = 5;
  o.push(`<rect x="${bx - 6}" y="${by - 22}" width="${L * vista.k + 40}" height="40" fill="#ffffffe6" rx="4"/>`);
  for (let i = 0; i < n; i++) o.push(`<rect x="${bx + i * L * vista.k / n}" y="${by}" width="${L * vista.k / n}" height="5" fill="${i % 2 ? "#fff" : tinta}" stroke="${tinta}" stroke-width="0.8"/>`);
  o.push(`<text x="${bx}" y="${by - 6}" font-size="11" fill="${tinta}">0</text><text x="${bx + L * vista.k}" y="${by - 6}" font-size="11" text-anchor="middle" fill="${tinta}">${L} m</text>`);
  // norte
  o.push(`<g transform="translate(${W - 30},36)"><circle r="17" fill="#ffffffe6" stroke="#9fb0b7"/><path d="M0 -13 L6 7 L0 3 L-6 7 Z" fill="${tinta}"/><text y="-20" font-size="12" font-weight="700" text-anchor="middle" fill="${tinta}">N</text></g>`);
  // leyenda de servicios
  const ley = D.leyenda || [], lw = 200, lh = 16 * ley.length + 26, lx = W - lw - 10, ly = H - lh - 74;
  if (ley.length && capasOn.has("canerias")) {
    o.push(`<rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" fill="#ffffffe6" stroke="#c9d6db" rx="4"/>`);
    o.push(`<text x="${lx + 10}" y="${ly + 16}" font-size="11.5" font-weight="700" fill="${tinta}">Servicios (código de línea)</text>`);
    ley.forEach((it, i) => {
      // PAT 140 i: muestra y abreviatura con el color del servicio en las dos vistas (en la vista de plano los trazos siguen en negro,
      // pero el código de cada línea va con este color)
      const y = ly + 32 + i * 16, c = it.color || tinta, da = it.srv === "electricidad" ? ' stroke-dasharray="6 2 1.5 2"' : "";
      o.push(`<line x1="${lx + 10}" y1="${y - 4}" x2="${lx + 36}" y2="${y - 4}" stroke="${c}" stroke-width="${it.srv === "electricidad" ? 2 : 3.5}"${da}/>`);
      o.push(`<text x="${lx + 44}" y="${y}" font-size="11.5" fill="${tinta}"${it.presente ? "" : ' opacity=".55"'}>${esc(it.nombre)} (<tspan fill="${c}" font-weight="700">${esc(it.abreviatura)}</tspan>)</text>`);
    });
  }
  // rótulo
  const cj = D.cajetin || {}, filas = [["Proyecto", cj.proyecto || ""], ["Plano", cj.titulo || ""], ["Fecha", cj.fecha || ""], ["Autor", cj.autor || ""]];
  const rw = 330, rh = 15 * filas.length + 8, rx = W - rw - 10, ry = H - rh - 10;
  o.push(`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="#ffffffee" stroke="#6f8089"/>`);
  filas.forEach(([a, b], i) => {
    const y = ry + 16 + i * 15, t = String(b).length > 54 ? String(b).slice(0, 53) + "…" : b;
    o.push(`<text x="${rx + 8}" y="${y}" font-size="10" fill="#5b7280">${a}</text><text x="${rx + 58}" y="${y}" font-size="11" fill="${tinta}">${esc(t)}</text>`);
  });
  $("sobre").innerHTML = o.join("");
}

// ------------------------------------------------------------------ interacción
function punto(ev) { const r = $("svg").getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
// PAT 140 i: si el puntero cae sobre algo que no es un equipo, se busca el equipo cuya huella contiene el punto (el más chico si se
// superponen), para que un equipo superpuesto o tapado se pueda tomar igual
function equipoEn(mx, my) {
  let mejor = null, area = Infinity;
  for (const id of Object.keys(POS)) {
    if (!eqPor(id)) continue;
    const h = huella(id), a = (h[2] - h[0]) * (h[3] - h[1]);
    if (mx >= h[0] && mx <= h[2] && my >= h[1] && my <= h[3] && a < area) { mejor = id; area = a; }
  }
  return mejor;
}
$("svg").addEventListener("pointerdown", ev => {
  const [px, py] = punto(ev), g = ev.target.closest(".eq"), mx = MX(px), my = MY(py);
  // donde dos equipos se superponen manda el que estaba seleccionado (el último que se movió), para poder seguir separándolo
  const hs = sel && POS[sel] && eqPor(sel) ? huella(sel) : null;
  const enSel = hs && mx >= hs[0] && mx <= hs[2] && my >= hs[1] && my <= hs[3] && capasOn.has("equipos");
  const id = enSel ? sel : g ? g.dataset.id : (capasOn.has("equipos") ? equipoEn(mx, my) : null);
  if (id && POS[id]) {
    sel = id;
    const n = [...$("g-eq").children].find(c => c.dataset.id === id);   // el equipo tomado queda encima de los que se le superponen
    if (n && n !== $("g-eq").lastElementChild) $("g-eq").appendChild(n);
    drag = {t: "eq", id, dx: MX(px) - POS[id][0], dy: MY(py) - POS[id][1], movio: false};
  } else { sel = null; drag = {t: "vista", px, py, tx: vista.tx, ty: vista.ty}; }
  $("svg").setPointerCapture(ev.pointerId);
  pintar();
});
$("svg").addEventListener("pointermove", ev => {
  if (!drag) return;
  const [px, py] = punto(ev);
  if (drag.t === "eq") {
    POS[drag.id][0] = MX(px) - drag.dx; POS[drag.id][1] = MY(py) - drag.dy;
    if (!drag.movio) { drag.movio = true; sinConfirmar.add(drag.id); }
  } else { vista.tx = drag.tx + px - drag.px; vista.ty = drag.ty + py - drag.py; vistaManual = true; }
  pintar();
});
function soltar() {
  if (drag && drag.t === "eq" && drag.movio) {
    const p = POS[drag.id]; p[0] = Math.round(p[0] / PASO) * PASO; p[1] = Math.round(p[1] / PASO) * PASO;
    drag = null; pintar(); enviar(); return;
  }
  drag = null;
}
$("svg").addEventListener("pointerup", soltar);
$("svg").addEventListener("pointercancel", soltar);
$("svg").addEventListener("dblclick", ev => { const g = ev.target.closest(".eq"); if (g) { sel = g.dataset.id; rotar(); } });
$("svg").addEventListener("wheel", ev => {
  ev.preventDefault();
  const [px, py] = punto(ev), mx = MX(px), my = MY(py), f = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoom(f, px, py, mx, my);
}, {passive: false});
function zoom(f, px, py, mx, my) {
  vista.k = Math.max(0.5, Math.min(160, vista.k * f));
  vista.tx = px - mx * vista.k; vista.ty = py + my * vista.k; vistaManual = true; pintar();
}
function rotar() {
  if (!sel || !POS[sel]) return;
  POS[sel][2] = (Math.round(POS[sel][2] / 90) * 90 + 90) % 360; sinConfirmar.add(sel); pintar(); enviar();
}
$("b-rot").onclick = rotar;
$("b-ajustar").onclick = () => { vistaManual = false; encuadre = "nave"; ajustar(); };
$("b-sitio").onclick = () => { vistaManual = false; encuadre = "sitio"; ajustar(); };
$("z-mas").onclick = () => { const r = $("plano").getBoundingClientRect(), px = r.width / 2, py = r.height / 2; zoom(1.25, px, py, MX(px), MY(py)); };
$("z-menos").onclick = () => { const r = $("plano").getBoundingClientRect(), px = r.width / 2, py = r.height / 2; zoom(0.8, px, py, MX(px), MY(py)); };
document.addEventListener("keydown", ev => {
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
  if ((ev.key === "r" || ev.key === "R") && sel) { ev.preventDefault(); rotar(); }
  if (ev.key === "Escape") { sel = null; pintar(); }
  const paso = ev.shiftKey ? 5 * PASO : PASO, mov = {ArrowLeft: [-paso, 0], ArrowRight: [paso, 0], ArrowUp: [0, paso], ArrowDown: [0, -paso]}[ev.key];
  if (mov && sel) { ev.preventDefault(); POS[sel][0] += mov[0]; POS[sel][1] += mov[1]; sinConfirmar.add(sel); pintar(); enviar(); }
});
new ResizeObserver(() => { if (D) { if (!vistaManual) ajustar(); else pintar(); altura(); } }).observe($("plano"));
aST("streamlit:componentReady", {apiVersion: 1});
</script>
